[project]
name = "scribe"
version = "0.1.0"
description = "Slack -> text extraction -> ollama -> full note back in the thread as pdf/md/docx."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "pillow>=11.1.0",
    "pypdfium2>=4.30.0",
    "trafilatura>=2.0.0",
    "slack-bolt>=1.21.0",
    "weasyprint>=66.0",
]

[project.scripts]
scribe = "scribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
